<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>プリズム合成計算</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #f3f5f8; color: #1d2733;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 16px;
  }
  header {
    background: #1f4e79; color: #fff; padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px; padding: 6px 14px; font-size: 14px;
  }
  main { max-width: 960px; margin: 0 auto; padding: 12px; }
  .eyes { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .eyes { grid-template-columns: 1fr 1fr; } }
  .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .badge { color: #fff; border-radius: 6px; padding: 2px 10px; font-size: 15px; }
  .R .badge { background: #c0392b; }
  .L .badge { background: #1f6fb5; }
  .row { margin-bottom: 10px; }
  .row label { display: block; font-size: 13px; color: #66727f; margin-bottom: 4px; font-weight: 600; }
  .inline { display: flex; gap: 8px; }
  .inline input {
    flex: 1; min-width: 0; font-size: 22px; padding: 8px 10px; text-align: right;
    border: 1px solid #c9d1da; border-radius: 8px; background: #fff; color: #1d2733;
  }
  .unit { align-self: center; color: #66727f; }
  .seg { display: flex; border: 1px solid #1f4e79; border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: #fff; color: #1f4e79; font-size: 15px; font-weight: 700;
    padding: 0 12px; min-width: 52px;
  }
  .seg button + button { border-left: 1px solid #1f4e79; }
  .seg button.on { background: #1f4e79; color: #fff; }
  svg.graph { display: block; width: 100%; max-width: 360px; margin: 6px auto 0; }
  .res { background: #e3edf7; border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .res table { width: 100%; border-collapse: collapse; }
  .res td { padding: 4px 2px; font-size: 15px; }
  .res td:last-child { text-align: right; font-weight: 700; }
  .res tr.sum td { border-top: 1px solid #b9c9da; padding-top: 8px; font-size: 20px; }
  .total table { width: 100%; border-collapse: collapse; }
  .total td { padding: 8px 2px; border-bottom: 1px solid #e1e6ec; }
  .total td:last-child { text-align: right; font-weight: 700; }
  .note { font-size: 12px; color: #66727f; line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>プリズム合成計算</h1>
  <button id="clear" type="button">クリア</button>
</header>
<main>
  <div class="eyes">
    <div class="card R" id="R"></div>
    <div class="card L" id="L"></div>
  </div>
  <div class="card total" style="margin-top:12px">
    <h2>両眼の合計</h2>
    <table>
      <tr><td>水平（両眼合計）</td><td id="tH">—</td></tr>
      <tr><td>垂直（上下差）</td><td id="tV">—</td></tr>
    </table>
    <div class="note">
      グラフは検者側（正面）から見た向きです。X軸＝水平、Y軸＝垂直。<br>
      基底方向は360°表記（右0°・上90°・左180°・下270°）。右眼のBIは0°、左眼のBIは180°。<br>
      垂直の上下差は「右BU＝左BD」として合算しています。
    </div>
  </div>
</main>

<script>
(function () {
  var EYES = [
    { id: 'R', name: '右眼', nasalRight: true,  color: '#c0392b' },
    { id: 'L', name: '左眼', nasalRight: false, color: '#1f6fb5' }
  ];
  var STORE = 'prism-calc-v2';

  function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
  function num(el) { var v = parseFloat(el.value); return isFinite(v) && v > 0 ? v : 0; }

  // 各眼のカードを作成
  EYES.forEach(function (eye) {
    var c = document.getElementById(eye.id);
    c.innerHTML =
      '<h2><span class="badge">' + eye.id + '</span>' + eye.name + '</h2>' +
      '<div class="row"><label>水平プリズム（X軸）</label><div class="inline">' +
        '<input type="number" inputmode="decimal" step="0.25" min="0" placeholder="0.00" data-k="h">' +
        '<span class="unit">Δ</span>' +
        '<div class="seg" data-k="hb"><button type="button" data-v="BI" class="on">BI</button><button type="button" data-v="BO">BO</button></div>' +
      '</div></div>' +
      '<div class="row"><label>垂直プリズム（Y軸）</label><div class="inline">' +
        '<input type="number" inputmode="decimal" step="0.25" min="0" placeholder="0.00" data-k="v">' +
        '<span class="unit">Δ</span>' +
        '<div class="seg" data-k="vb"><button type="button" data-v="BU" class="on">BU</button><button type="button" data-v="BD">BD</button></div>' +
      '</div></div>' +
      '<svg class="graph" viewBox="0 0 300 300"></svg>' +
      '<div class="res"><table>' +
        '<tr><td>水平 X</td><td class="oX">—</td></tr>' +
        '<tr><td>垂直 Y</td><td class="oY">—</td></tr>' +
        '<tr class="sum"><td>合成値</td><td class="oP">—</td></tr>' +
        '<tr><td>基底方向</td><td class="oA">—</td></tr>' +
      '</table></div>';

    c.querySelectorAll('.seg button').forEach(function (b) {
      b.addEventListener('click', function () {
        b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        update();
      });
    });
    c.querySelectorAll('input').forEach(function (i) { i.addEventListener('input', update); });
  });

  function get(eye) {
    var c = document.getElementById(eye.id);
    return {
      c: c,
      h: num(c.querySelector('input[data-k="h"]')),
      v: num(c.querySelector('input[data-k="v"]')),
      hb: c.querySelector('.seg[data-k="hb"] .on').getAttribute('data-v'),
      vb: c.querySelector('.seg[data-k="vb"] .on').getAttribute('data-v')
    };
  }

  // X/Y グラフ描画
  function draw(svg, eye, x, y, p) {
    var C = 150, R = 120;
    var maxV = Math.max(4, Math.ceil(Math.max(Math.abs(x), Math.abs(y))));
    var sc = R / maxV;
    var right = eye.nasalRight ? 'BI' : 'BO';
    var left  = eye.nasalRight ? 'BO' : 'BI';
    var s = '';
    // 目盛り
    var step = maxV > 10 ? 2 : 1;
    for (var i = -maxV; i <= maxV; i += step) {
      var g = C + i * sc;
      s += '<line x1="' + g + '" y1="' + (C - R) + '" x2="' + g + '" y2="' + (C + R) + '" stroke="#eef1f4"/>';
      s += '<line x1="' + (C - R) + '" y1="' + g + '" x2="' + (C + R) + '" y2="' + g + '" stroke="#eef1f4"/>';
      if (i !== 0) {
        s += '<text x="' + g + '" y="' + (C + 12) + '" font-size="8" fill="#9aa6b2" text-anchor="middle">' + Math.abs(i) + '</text>';
        s += '<text x="' + (C - 4) + '" y="' + (C - i * sc + 3) + '" font-size="8" fill="#9aa6b2" text-anchor="end">' + Math.abs(i) + '</text>';
      }
    }
    // 軸
    s += '<line x1="' + (C - R - 8) + '" y1="' + C + '" x2="' + (C + R + 8) + '" y2="' + C + '" stroke="#5b6773" stroke-width="1.5"/>';
    s += '<line x1="' + C + '" y1="' + (C - R - 8) + '" x2="' + C + '" y2="' + (C + R + 8) + '" stroke="#5b6773" stroke-width="1.5"/>';
    s += '<text x="' + (C + R + 6) + '" y="' + (C - 6) + '" font-size="12" font-weight="700" fill="#1d2733" text-anchor="end">' + right + '</text>';
    s += '<text x="' + (C - R - 6) + '" y="' + (C - 6) + '" font-size="12" font-weight="700" fill="#1d2733">' + left + '</text>';
    s += '<text x="' + (C + 6) + '" y="' + (C - R - 2) + '" font-size="12" font-weight="700" fill="#1d2733">BU</text>';
    s += '<text x="' + (C + 6) + '" y="' + (C + R + 6) + '" font-size="12" font-weight="700" fill="#1d2733">BD</text>';
    s += '<text x="' + (eye.nasalRight ? C + R : C - R) + '" y="' + (C + 26) + '" font-size="9" fill="#66727f" text-anchor="' + (eye.nasalRight ? 'end' : 'start') + '">（鼻側）</text>';

    if (p > 0) {
      var px = C + x * sc, py = C - y * sc;
      // X・Y 成分
      s += '<line x1="' + C + '" y1="' + C + '" x2="' + px + '" y2="' + C + '" stroke="#2e8b57" stroke-width="4" stroke-linecap="round"/>';
      s += '<line x1="' + px + '" y1="' + C + '" x2="' + px + '" y2="' + py + '" stroke="#d68910" stroke-width="4" stroke-linecap="round"/>';
      s += '<line x1="' + C + '" y1="' + py + '" x2="' + px + '" y2="' + py + '" stroke="#999" stroke-dasharray="4 3"/>';
      // 合成ベクトル
      var ang = Math.atan2(py - C, px - C);
      var ax1 = px - Math.cos(ang - 0.4) * 11, ay1 = py - Math.sin(ang - 0.4) * 11;
      var ax2 = px - Math.cos(ang + 0.4) * 11, ay2 = py - Math.sin(ang + 0.4) * 11;
      s += '<line x1="' + C + '" y1="' + C + '" x2="' + px + '" y2="' + py + '" stroke="' + eye.color + '" stroke-width="3.5" stroke-linecap="round"/>';
      s += '<polygon points="' + px + ',' + py + ' ' + ax1 + ',' + ay1 + ' ' + ax2 + ',' + ay2 + '" fill="' + eye.color + '"/>';
      s += '<circle cx="' + px + '" cy="' + py + '" r="4" fill="' + eye.color + '"/>';
    }
    s += '<circle cx="' + C + '" cy="' + C + '" r="3" fill="#1d2733"/>';
    svg.innerHTML = s;
  }

  function update() {
    var totalBI = 0, relV = 0, any = false;
    EYES.forEach(function (eye) {
      var d = get(eye);
      var hBI = d.hb === 'BI' ? d.h : -d.h;       // BIを正
      var vBU = d.vb === 'BU' ? d.v : -d.v;       // BUを正
      var x = eye.nasalRight ? hBI : -hBI;        // 画面右を正
      var y = vBU;
      var p = Math.sqrt(x * x + y * y);
      var deg = Math.atan2(y, x) * 180 / Math.PI;
      if (deg < 0) deg += 360;
      deg = Math.round(deg) % 360;

      d.c.querySelector('.oX').textContent = d.h > 0 ? f2(d.h) + 'Δ ' + d.hb : '0.00Δ';
      d.c.querySelector('.oY').textContent = d.v > 0 ? f2(d.v) + 'Δ ' + d.vb : '0.00Δ';
      d.c.querySelector('.oP').textContent = p > 0 ? f2(p) + 'Δ' : '—';
      d.c.querySelector('.oA').textContent = p > 0 ? deg + '°' : '—';
      draw(d.c.querySelector('svg'), eye, x, y, p);

      totalBI += hBI;
      relV += eye.id === 'R' ? vBU : -vBU;
      if (d.h || d.v) any = true;
    });
    document.getElementById('tH').textContent = !any ? '—'
      : Math.abs(totalBI) < 1e-9 ? '0.00Δ' : f2(Math.abs(totalBI)) + 'Δ ' + (totalBI > 0 ? 'BI' : 'BO');
    document.getElementById('tV').textContent = !any ? '—'
      : Math.abs(relV) < 1e-9 ? '0.00Δ'
      : relV > 0 ? f2(relV) + 'Δ（右BU／左BD）' : f2(-relV) + 'Δ（右BD／左BU）';
    save();
  }

  function save() {
    var data = {};
    EYES.forEach(function (eye) {
      var c = document.getElementById(eye.id);
      data[eye.id] = {
        h: c.querySelector('input[data-k="h"]').value,
        v: c.querySelector('input[data-k="v"]').value,
        hb: c.querySelector('.seg[data-k="hb"] .on').getAttribute('data-v'),
        vb: c.querySelector('.seg[data-k="vb"] .on').getAttribute('data-v')
      };
    });
    try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {}
  }

  function setSeg(c, k, v) {
    var btns = c.querySelectorAll('.seg[data-k="' + k + '"] button');
    var found = false;
    btns.forEach(function (b) { var on = b.getAttribute('data-v') === v; b.classList.toggle('on', on); if (on) found = true; });
    if (!found) btns[0].classList.add('on');
  }

  function load() {
    var data = null;
    try { data = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    if (!data) return;
    EYES.forEach(function (eye) {
      var d = data[eye.id]; if (!d) return;
      var c = document.getElementById(eye.id);
      c.querySelector('input[data-k="h"]').value = d.h || '';
      c.querySelector('input[data-k="v"]').value = d.v || '';
      setSeg(c, 'hb', d.hb);
      setSeg(c, 'vb', d.vb);
    });
  }

  // 確認ダイアログ(confirm)はスマホのアプリ内ブラウザ等で無効化されることがあるため、2回タップ方式
  var clearBtn = document.getElementById('clear');
  var clearTimer = null;
  function resetClearBtn() {
    clearTimer = null;
    clearBtn.textContent = 'クリア';
    clearBtn.style.background = '';
  }
  clearBtn.addEventListener('click', function () {
    if (!clearTimer) {
      clearBtn.textContent = 'もう一度押す';
      clearBtn.style.background = '#c0392b';
      clearTimer = setTimeout(resetClearBtn, 3000);
      return;
    }
    clearTimeout(clearTimer);
    resetClearBtn();
    EYES.forEach(function (eye) {
      var c = document.getElementById(eye.id);
      c.querySelectorAll('input').forEach(function (i) { i.value = ''; });
      setSeg(c, 'hb', 'BI');
      setSeg(c, 'vb', 'BU');
    });
    update();
  });

  load();
  update();
})();
</script>
</body>
</html>
